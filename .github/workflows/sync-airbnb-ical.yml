# Pull Airbnb iCal bookings into Kamala every 3 hours.
# Requires repo secrets: CRON_SECRET, NEXT_PUBLIC_APP_URL
# Prefer https://www.kamalaguesthouse.com — apex kamalaguesthouse.com fails DNS
# on some GitHub Actions resolvers (curl exit 6).
name: Sync Airbnb iCal

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Airbnb calendars
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "Missing CRON_SECRET or NEXT_PUBLIC_APP_URL secrets."
            exit 1
          fi

          base="${APP_URL%/}"
          # Apex DNS for this property is flaky on Actions runners; www resolves.
          case "$base" in
            https://kamalaguesthouse.com|http://kamalaguesthouse.com)
              base="https://www.kamalaguesthouse.com"
              echo "Using www host (apex DNS unreliable on runners)."
              ;;
          esac

          url="${base}/api/cron/sync-ical?channel=airbnb"
          echo "POST target host: $(printf '%s' "$base" | sed -E 's#https?://##')"

          if ! curl -fsS --retry 2 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url"; then
            echo "::error::iCal sync request failed for ${base}"
            exit 1
          fi
